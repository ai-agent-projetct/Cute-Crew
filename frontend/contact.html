<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Cute Crew</title>
  <meta name="description" content="Get in touch with the Cute Crew team.">
  <meta name="theme-color" content="#e8352b">
  <link rel="icon" href="/assets/img/favicon.png?v=8" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body class="font-body">
  <div id="site-header"></div>

  <main class="max-w-3xl mx-auto px-4 pt-8 pb-20">
    <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-1.5">We're Here to Help</p>
    <h1 class="font-display font-extrabold text-3xl md:text-4xl mb-6">Contact Us</h1>
    <div class="grid sm:grid-cols-2 gap-4 mb-8">
      <div class="p-card p-5">
        <p class="text-xs font-bold uppercase tracking-widest text-soft mb-2">Email</p>
        <p class="font-semibold">support@cutecrew.example</p>
      </div>
      <div class="p-card p-5">
        <p class="text-xs font-bold uppercase tracking-widest text-soft mb-2">Phone</p>
        <p class="font-semibold">+91 98765 43210</p>
      </div>
    </div>

    <form id="contact-form" class="p-card p-6 space-y-4">
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-soft block mb-1.5">Name</label>
        <input class="field" name="name" placeholder="Your name" required>
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-soft block mb-1.5">Email</label>
        <input class="field" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-soft block mb-1.5">Message</label>
        <textarea class="field" name="message" rows="4" placeholder="How can we help?" required></textarea>
      </div>
      <button class="btn-gold px-8 py-3.5 text-sm">Send Message</button>
      <p id="contact-msg" class="text-mint text-sm hidden">Thanks! We'll get back to you soon.</p>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('contact-msg').classList.remove('hidden');
      e.target.reset();
    });
  </script>
</body>
</html>
